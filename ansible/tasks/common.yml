---
- name: Install wireguard (Debian)
  become: true
  ansible.builtin.apt:
    package:
      - wireguard
      - apparmor-utils
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"

- name: Install wireguard (RedHat)
  become: true
  ansible.builtin.dnf:
    name: wireguard-tools
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "RedHat"

- name: Install wireguard (Arch)
  become: true
  community.general.pacman:
    name: wireguard-tools
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Archlinux"

- name: Disable apparmor (Debian)
  become: true
  ansible.builtin.command: aa-complain /etc/apparmor.d/wg-quick
  when: ansible_facts["os_family"] == "Debian"

- name: Copy authorized keys to /root
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /home/{{ ansible_user }}/.ssh/authorized_keys
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
  when: ansible_user != "root"

- name: Set timezone to the one provided in the settings
  become: true
  community.general.timezone:
    name: "{{ ad.timezone }}"
