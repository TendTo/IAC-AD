---
- name: Make sure Python virtual environment support is installed
  become: true
  ansible.builtin.package:
    name: 
      - python3-pip
      - python3-venv
      - pipx
    state: present

- name: Install uv
  community.general.pipx:
    name: uv
    state: present

- name: Clone the ForcAD repository
  ansible.builtin.git:
    repo: https://github.com/TendTo/ForcAD.git
    version: "a4b26cd2fcbf86bad8b77aed2c3bb9304ae1b9c5"
    dest: ForcAD
    force: true

- name: Copy checkers to the server
  ansible.builtin.copy:
    src: checkers/
    dest: ForcAD/checkers/
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: List the checkers of the server
  ansible.builtin.find:
    paths: ForcAD/checkers/
    file_type: directory
    recurse: false
  register: checkers_files

- name: ForcAD configuration
  ansible.builtin.template:
    src: templates/forcAD.config.yml.j2
    dest: ForcAD/config.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    force: false
  vars:
    open_conf: "{{ wireguard.router.open }}"
    checkers: "{{ checkers_files.files | map(attribute='path') | map('basename') | list }}"

- name: Setup the deployment
  ansible.builtin.command:
    cmd: /home/{{ ansible_user }}/.local/bin/uv run ./control.py setup
    chdir: ForcAD
    creates: config_backup*
  changed_when: true

- name: Start the deployment
  ansible.builtin.command:
    cmd: /home/{{ ansible_user }}/.local/bin/uv run ./control.py start
    chdir: ForcAD
  changed_when: true
